name: Module 3 CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r subtitle_mismatch_tool/requirements.txt
          pip install pytest bandit pip-audit

      - name: Run static syntax checks
        run: |
          python -m py_compile subtitle_mismatch_tool/main.py
          python -m py_compile subtitle_mismatch_tool/compare.py
          python -m py_compile subtitle_mismatch_tool/report.py

      - name: Run unit tests
        run: pytest -q

      - name: Run Bandit security scan
        run: bandit -q -r subtitle_mismatch_tool -x subtitle_mismatch_tool/sample_output

      - name: Run dependency vulnerability scan
        run: pip-audit -r subtitle_mismatch_tool/requirements.txt
